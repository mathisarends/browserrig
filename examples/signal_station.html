<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Signal station</title>
  </head>
  <body>
    <main>
      <h1>Signal station</h1>
      <p>Activate the beacon to receive a signal code.</p>
      <button type="button">Activate beacon</button>
      <p role="status">Beacon idle</p>
    </main>
    <script>
      document.querySelector('button').addEventListener('click', () => {
        document.querySelector('[role="status"]').textContent = 'Signal code: NOVA-42';
      });
    </script>
  </body>
</html>
