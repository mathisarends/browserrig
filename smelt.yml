# yaml-language-server: $schema=.smelt.schema.json
# Static guardrails for browserrig. Rule details: `smelt explain <code>`.
# Existing findings live in .smelt/debt.json; `smelt debt --prune` after fixing them.
version: 1

project:
  source_roots: [.]
  root_packages: [browserrig]
  test_roots: [tests]
  exclude:
    - {path: "evals/**", reason: "Eval scripts drive the library like a user would."}
    - {path: "examples/**", reason: "Examples use the public API only."}

debt: .smelt/debt.json

structure:
  contracts:
    conventions:
      match: browserrig
      # Siblings via `from .x import y`, everything further away absolute.
      imports: {style: relative, max_relative_level: 1}
      future_annotations: when-needed
      private_modules: forbid
      type_dispatch: {style: match, min_branches: 3}
      ordering:
        constants_exempt: true
        fix: safe-only
    # Packages depend on each other only through their __init__ facade
    # (SMT107 error); tests may still import implementation modules.
    # SMT108 hints when one file reaches into several modules of a package.
    package-facades:
      match: browserrig.*
      public: ['.']
      bundle_imports_at: 2

# Every package depends only on the packages listed under it (SMT101), so a new
# dependency between packages is a decision made here, not an accident.
architecture:
  composition_root: [browserrig.composition, browserrig.agent]
  # Annotations may name types from anywhere; only runtime imports couple packages.
  imports: {type_checking: ignore}
  modules:
    browserrig.kinds: core
    browserrig.events: core
    browserrig.terminal: terminal
    browserrig.completion: completion
  layers:
    core: {path: core}
    scripts: {path: scripts, may_depend_on: [core]}
    files: {path: files, may_depend_on: [core]}
    input: {path: input, may_depend_on: [core]}
    browser: {path: browser, may_depend_on: [core, scripts, files, input]}
    readiness: {path: readiness, may_depend_on: [core, scripts, files, browser]}
    observation:
      path: observation
      may_depend_on: [core, scripts, browser, readiness, nudges, secrets]
    nudges: {path: nudges, may_depend_on: [core, browser]}
    # Observation redacts with secrets; the way back is recorded debt.
    secrets: {path: secrets, may_depend_on: [core, scripts, input, browser]}
    tools:
      path: tools
      may_depend_on: [core, scripts, files, input, browser, readiness, observation, secrets]
      third_party: {deny: [cdpify]}
    activity: {path: activity, may_depend_on: [core]}
    recording: {path: recording, may_depend_on: [core, browser, activity]}
    handoff:
      path: handoff
      may_depend_on: [core, browser, nudges, observation, secrets]
    # How input is performed is optional: it builds on the browser, nothing builds on it.
    pacing: {path: pacing, may_depend_on: [core, input, browser]}
    # Staging for viewers is optional: it builds on the rest, nothing builds on it.
    choreography:
      path: choreography
      may_depend_on: [core, scripts, input, browser, observation, tools]
    terminal: {path: terminal, may_depend_on: [core]}
    completion: {path: completion}

tests:
  layout: none  # tests are flat (tests/test_<topic>.py), not mirrored
  max_patches_per_test: 3

# error: deterministic patterns without false positives in this codebase.
# warning: heuristics that need a look in context.
rules:
  # Source conventions
  import-cycle: error
  public-definitions-first: error
  bundled-instance-assignment: error
  redundant-str-enum-value: error
  prefer-str-enum-discriminator: hint
  implicit-optional-default: warning
  no-base-class-prefix: error
  no-base-class-suffix: error
  secret-settings-field: warning
  package-only-dunder-all: error
  caller-before-callee: hint
  prefer-package-import: error
  internal-public-member: error
  internal-static-helper: error
  unnecessary-future-annotations: warning
  prefer-match-type-dispatch: warning
  # Test smells
  private-test-access: error
  string-patch-target: error
  test-only-public-function: error
  # Attributes of exported classes (Tab, ChromeBrowser) may be read by library
  # users, which smelt cannot see; review instead of failing.
  test-only-public-attribute: warning
  test-without-outcome-check: warning
  test-only-checks-possibly-empty-data: warning
  unbounded-test-wait: warning
  async-mock-without-await-check: warning
  independent-test-case-loop: hint
  nondeterministic-test-data: warning
