# yaml-language-server: $schema=.smelt.schema.json
# Static guardrails for browserrig. Rule details: `smelt explain <code>`.
# Existing findings live in .smelt/debt.json; `smelt debt --prune` after fixing them.
version: 2

project:
  source_roots: [.]
  root_packages: [browserrig]
  test_roots: [tests]
  exclude:
    - {path: ".browserrig/**", reason: "Generated browser state and temporary worktrees are not project sources."}
    - {path: ".uv-cache/**", reason: "Local uv cache contains third-party packages and downloaded checkouts."}
    - {path: "evals/**", reason: "Eval scripts drive the library like a user would."}
    - {path: "examples/**", reason: "Examples use the public API only."}

debt: .smelt/debt.json

ignore:
  - rule: layout/file-name-convention
    paths: [pnpm-lock.yaml]
    reason: "pnpm requires this exact lockfile name."

style:
  forbidden_names: [common, helpers, util, utils]
  reexports: all
  file_naming: {yaml_extension: yml, compose_basename: compose}
  str_enum_values: explicit
  overrides:
    conventions:
      match: browserrig
      # Siblings via `from .x import y`, everything further away absolute.
      imports: {style: relative, max_relative_level: 1}
      future_annotations: when-needed
      private_modules: forbid
      type_dispatch: {style: match, min_branches: 3}
      bases: {pydantic.BaseModel: browserrig.core.Options}
      ordering:
        constants_exempt: true
        fix: safe-only
      rules:
        # Later parameters are keyword-only so call sites name their values.
        complexity/excess-positional-parameters: {max: 4}
    # These areas also forbid unnecessary future imports in decorated code.
    input-annotations:
      match: browserrig.input
      future_annotations: forbid
    script-annotations:
      match: browserrig.scripts
      future_annotations: forbid
    recording-values:
      match: browserrig.recording
      dataclass_options: [frozen, slots]
    core-docstrings:
      match: browserrig.core
      module_docstrings: require
    browser-errors:
      match: browserrig.browser
      errors: {base: browserrig.core.BrowserError, allow: [ValueError]}
    guardrail-errors:
      match: browserrig.guardrails
      errors: {base: browserrig.core.BrowserError, allow: [TypeError, ValueError]}
    readiness-errors:
      match: browserrig.readiness
      errors: {base: browserrig.core.BrowserError}

# Each layer lists the other layers it may depend on.
architecture:
  composition_root: [browserrig.composition, browserrig.agent]
  # Annotations may name types from anywhere; only runtime imports couple packages.
  import_graph: {type_checking: ignore}
  packages:
    dom-rendering:
      match: browserrig.dom.rendering
      public: ['.']
      min_importers_to_export: 3
    spreadsheet-readers:
      match: browserrig.files.spreadsheets
      public: ['.']
      min_importers_to_export: 3
    # Packages depend on each other only through their __init__ facade
    # (ARC007); focused test seams need reasoned import-level exceptions.
    # IMP001 flags several internal imports from a single caller. ARC008 looks
    # for symbols used by at least three outside production modules.
    package-facades:
      match: browserrig.*
      public: ['.']
      min_imports_to_bundle: 2
      min_importers_to_export: 3

  layers:
    core: {modules: [browserrig.core, browserrig.kinds, browserrig.events]}
    scripts: {modules: [browserrig.scripts], may_depend_on: [core]}
    files: {modules: [browserrig.files], may_depend_on: [core]}
    input:
      modules: [browserrig.input]
      may_depend_on: [core]
      third_party: {deny: [cdpify]}
    browser: {modules: [browserrig.browser], may_depend_on: [core, scripts, files, input]}
    guardrails: {modules: [browserrig.guardrails], may_depend_on: [core, browser]}
    readiness: {modules: [browserrig.readiness], may_depend_on: [core, scripts, files, browser]}
    observation:
      modules: [browserrig.observation]
      may_depend_on: [core, scripts, files, input, browser, readiness, nudges, secrets]
    # Reading pages from the DOM is one page model; observation knows none of it.
    dom: {modules: [browserrig.dom], may_depend_on: [core, scripts, browser, observation]}
    nudges: {modules: [browserrig.nudges], may_depend_on: [core, browser]}
    # Observation uses secrets for redaction.
    secrets: {modules: [browserrig.secrets], may_depend_on: [core, scripts, input, browser]}
    tools:
      modules: [browserrig.tools]
      may_depend_on: [core, scripts, files, input, browser, readiness, observation, dom, secrets]
      third_party: {deny: [cdpify]}
    activity: {modules: [browserrig.activity], may_depend_on: [core]}
    recording: {modules: [browserrig.recording], may_depend_on: [core, browser, activity]}
    screencast: {modules: [browserrig.screencast], may_depend_on: [core, browser]}
    handoff:
      modules: [browserrig.handoff]
      may_depend_on: [core, browser, nudges, observation, dom, secrets]
    # Input behavior depends on the devices, independently of the browser backend.
    pacing: {modules: [browserrig.pacing], may_depend_on: [core, input]}
    # Staging for viewers is optional: it builds on the rest, nothing builds on it.
    choreography:
      modules: [browserrig.choreography]
      may_depend_on: [core, scripts, input, browser, observation, dom, tools, files, secrets]
    # Drawing that staging in the page only consumes its events; staging never draws.
    overlay: {modules: [browserrig.overlay], may_depend_on: [core, scripts, browser, choreography]}
    terminal: {modules: [browserrig.terminal], may_depend_on: [core]}
    completion: {modules: [browserrig.completion]}
    todos: {modules: [browserrig.todos], may_depend_on: [core]}
    memory: {modules: [browserrig.memory], may_depend_on: [core, files]}

tests:
  # tests/<package>/test_<module>.py mirrors browserrig/<package>/<module>.py; a topic
  # of one module may be split off as test_<module>_<topic>.py.
  layout: mirror
  mirror_suffixes: true
  mirror_exclude:
    - "tests/integration/**"  # real Chrome, spans several modules (pytest -m integration)
    - "tests/project/**"      # repository-wide checks: architecture, release, telemetry
  # These tests exercise domain behavior with real values or injected fakes.
  forbidden_mock_paths: ["tests/dom/**", "tests/memory/**", "tests/todos/**"]

rules:
  # Architecture and package contracts
  architecture/uncovered-source: error
  architecture/layer-boundary: error
  architecture/forbidden-third-party-import: error
  architecture/shared-imports-feature: error
  architecture/composition-root-leak: error
  architecture/import-cycle: error
  architecture/non-public-module-import: error
  architecture/missing-required-module: error
  architecture/missing-facade-export: error
  imports/forbidden-import-style: error
  imports/prefer-package-import: error
  layout/forbidden-module-name: error
  layout/forbidden-private-module: error
  layout/file-name-convention: error
  layout/module-docstring-convention: error

  # Source conventions
  visibility/reexport-convention: error
  visibility/internal-public-member: error
  visibility/internal-public-module-symbol: error
  visibility/internal-public-attribute: error
  modeling/missing-dataclass-option: error
  modeling/prefer-project-base-class: error
  modeling/prefer-domain-exception: error
  meta/unused-suppression: error
  meta/resolved-debt: error
  idioms/prefer-callable-instance: error
  layout/misplaced-private-constant: error
  layout/redundant-module-name: error
  layout/misplaced-module-logger: error
  layout/definition-order: error
  idioms/bundled-instance-assignment: error
  modeling/redundant-str-enum-value: error
  modeling/prefer-str-enum-discriminator: error
  typing/implicit-optional-default: error
  modeling/forbidden-base-class-affix: error
  frameworks/prefer-secret-type: error
  visibility/misplaced-dunder-all: error
  layout/callee-before-caller: error
  layout/misplaced-static-helper: error
  typing/forbidden-future-annotations: error
  typing/redundant-future-annotations: error
  idioms/prefer-match-type-dispatch: error
  visibility/foreign-private-access: error
  idioms/redundant-name-alias: error
  typing/prefer-deferred-annotations: error
  typing/duplicate-literal-type: error
  complexity/inline-call-argument: error
  visibility/redundant-private-delegate: error
  typing/deprecated-async-contextmanager-return: error
  modeling/str-enum-value-convention: error
  complexity/excess-positional-parameters: error
  typing/anonymous-tuple-type: error
  idioms/missing-interface-docstring: error
  idioms/missing-broad-except-reason: error
  complexity/duplicate-function: error
  modeling/duplicate-class-name: error
  modeling/implicit-duration-unit: error
  modeling/mutable-field-in-frozen-dataclass: error
  complexity/forbidden-nested-conditional: error
  # Record pairing and repeated lookup construction are enforced at their reported sites.
  modeling/parallel-record-fields: error
  idioms/loop-invariant-collection: error
  complexity/excess-comprehension-loops: error
  complexity/excess-constructor-decisions: error
  visibility/excess-private-definitions: error
  modeling/dataclass-field-mutation: error
  idioms/duplicate-narrowing-assert: error

  # Review candidates and their ownership rationale are recorded in docs/smelt-policy.md.
  imports/excess-package-imports: hint
  # A ninth dependency merits review. Facades and composition roots are exempt.
  imports/excess-module-imports: {severity: hint, max: 8}
  complexity/excess-attribute-depth: hint
  layout/reexport-only-module: hint
  meta/uncovered-package-facade: hint
  typing/prefer-inline-type-parameters: hint

  # Test layout and quality
  tests/misplaced-test: error
  tests/forbidden-mock: error
  tests/excess-patches: {severity: error, max: 3}
  tests/private-access: error
  tests/string-patch-target: error
  visibility/test-only-public-function: error
  visibility/test-only-public-attribute: error
  tests/missing-outcome-check: error
  tests/vacuous-assertion: error
  tests/unbounded-wait: error
  tests/missing-await-assertion: error
  tests/independent-case-loop: error
  tests/nondeterministic-data: error
