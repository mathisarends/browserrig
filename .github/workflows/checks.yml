name: checks

on: [push, pull_request]

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra openai --extra mcp --extra otel
      - run: uv run --no-sync prek validate-config .pre-commit-config.yaml
      - run: uv run --no-sync ruff check browserrig examples tests
      - run: uv run --no-sync ruff format --check browserrig examples tests
      - run: uv run --no-sync pylint browserrig examples tests
      - run: uv run --no-sync ty check
      - run: uv run --no-sync pytest -m "not integration"
      - run: uv build
      - run: uv run --no-sync python -m examples.openai_agent --help

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Allow Chrome sandbox user namespaces
        env:
          BROWSERRIG_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Ubuntu restricts user namespaces for binaries outside packaged browser paths.
          # Allow only this Chrome for Testing binary to use its sandbox.
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          cat <<EOF | sudo tee /etc/apparmor.d/browserrig-chrome > /dev/null
          abi <abi/4.0>,
          include <tunables/global>

          profile browserrig-chrome "$BROWSERRIG_CHROME" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/browserrig-chrome
      - name: Check Chrome startup
        env:
          BROWSERRIG_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: timeout 20s "$BROWSERRIG_CHROME" --headless=new --dump-dom about:blank
      - run: uv sync --locked
      - run: uv run --no-sync pytest -m integration
        env:
          BROWSERRIG_CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - name: Direct browser example smoke test
        run: uv run --no-sync python -m examples.direct_browser --url about:blank
        env:
          BROWSERRIG_CHROME: ${{ steps.chrome.outputs.chrome-path }}
