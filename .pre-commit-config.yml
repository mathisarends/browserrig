repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check browserrig examples tests
        language: system
        files: '^((browserrig|examples|tests)/.*\.py|pyproject\.toml|uv\.lock)$'
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check browserrig examples tests
        language: system
        files: '^((browserrig|examples|tests)/.*\.py|pyproject\.toml|uv\.lock)$'
        pass_filenames: false
      - id: pylint
        name: Pylint
        entry: uv run --locked pylint browserrig examples tests
        language: system
        files: '^((browserrig|examples|tests)/.*\.py|pyproject\.toml|uv\.lock)$'
        pass_filenames: false
        require_serial: true
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        files: '^((browserrig|examples|tests)/.*\.py|pyproject\.toml|uv\.lock)$'
        pass_filenames: false
      - id: smelt
        name: Smelt
        entry: uv run --locked smelt check --fail-on warning
        language: system
        files: '^((browserrig|tests)/.*\.py|smelt\.yml|\.smelt/debt\.json|pyproject\.toml|uv\.lock)$'
        pass_filenames: false
        require_serial: true
      - id: eslint
        name: ESLint
        entry: node node_modules/eslint/bin/eslint.js . --max-warnings 0
        language: system
        files: '(\.(js|mjs)$|^package(-lock)?\.json$)'
        pass_filenames: false
      - id: prettier
        name: JavaScript format
        entry: node node_modules/prettier/bin/prettier.cjs --check browserrig/**/*.js *.mjs
        language: system
        files: '(\.(js|mjs)$|^\.prettier(rc\.json|ignore)$|^package(-lock)?\.json$)'
        pass_filenames: false
