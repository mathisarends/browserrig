repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check browserrig examples tests
        language: system
        files: '^((browserrig|examples|tests)/.*\.py|pyproject\.toml|uv\.lock)$'
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check browserrig examples tests
        language: system
        files: '^((browserrig|examples|tests)/.*\.py|pyproject\.toml|uv\.lock)$'
        pass_filenames: false
      - id: pylint
        name: Pylint
        entry: uv run --locked pylint browserrig examples tests
        language: system
        files: '^((browserrig|examples|tests)/.*\.py|pyproject\.toml|uv\.lock)$'
        pass_filenames: false
        require_serial: true
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        files: '^((browserrig|examples|tests)/.*\.py|pyproject\.toml|uv\.lock)$'
        pass_filenames: false
      - id: smelt
        name: Smelt
        entry: uv run --locked smelt check --fail-on warning
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: eslint
        name: ESLint
        entry: pnpm run lint
        language: system
        files: '(\.(js|mjs)$|^package\.json$|^pnpm-lock\.yaml$)'
        pass_filenames: false
      - id: prettier
        name: JavaScript format
        entry: pnpm run format:check
        language: system
        files: '(\.(js|mjs)$|^\.prettier(rc\.json|ignore)$|^package\.json$|^pnpm-lock\.yaml$)'
        pass_filenames: false
