services:
  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    ports:
      - "127.0.0.1:6006:6006" # UI and OTLP/HTTP (/v1/traces)
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false" # Local development; port is bound to loopback only.
      PHOENIX_TELEMETRY_ENABLED: "false"
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

volumes:
  phoenix_data:
