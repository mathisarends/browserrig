<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      {{styles}}
    </style>
  </head>
  <body>
    <div id="edge" aria-hidden="true"></div>
    <div id="viewfinder" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <svg id="trail" aria-hidden="true"><path /></svg>
    <div id="matches"></div>
    <div id="ticks" aria-hidden="true"></div>
    <div id="highlight"><i></i><i></i><i></i><i></i></div>
    <div id="cursor" data-style="default">
      <div id="cursor-icon"></div>
      <div id="cursor-name">Browserrig</div>
      <div id="scroll-feedback">
        <span id="scroll-chevron">⌄</span><span id="scroll-label"></span>
      </div>
    </div>
    <div id="keyboard" class="panel" aria-hidden="true">
      <div id="keyboard-keys"></div>
      <div id="keyboard-caption"></div>
    </div>
    <div id="address" class="panel">
      <span id="address-icon"></span><span id="address-text"></span
      ><span id="address-caret"></span>
    </div>
    <div id="history" class="panel">
      <div id="history-icon"></div>
      <div id="history-copy"><b id="history-title"></b><span id="history-detail"></span></div>
    </div>
    <div id="find" class="panel">
      <span class="symbol">⌕</span><span id="find-text"></span
      ><span id="find-count"></span>
    </div>
    <div id="navigation" class="panel">
      <span id="navigation-icon"></span><span id="navigation-text"></span>
    </div>
    <div id="caption" class="panel" role="status" aria-live="polite">
      <div id="caption-icon"></div>
      <div id="caption-copy">
        <b id="caption-title"></b><span id="caption-detail"></span>
      </div>
      <div id="caption-state"></div>
    </div>
    <div id="downloads">
      <div id="opening" class="transfer panel">
        <div class="file-icon"></div>
        <div class="file-copy"><b></b><span></span></div>
        <div class="transfer-state"></div>
      </div>
      <div id="download" class="transfer panel">
        <div class="file-icon"></div>
        <div class="file-copy"><b></b><span></span></div>
        <div class="transfer-state"></div>
      </div>
    </div>
    <div id="upload" class="transfer panel">
      <div class="file-icon"></div>
      <div class="file-copy"><b></b><span></span></div>
      <div class="transfer-state"></div>
    </div>
    <div id="flying-file" class="file-icon"></div>
  </body>
</html>
