[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "browserrig"
version = "0.1.0"
description = "Event-driven Chrome automation for Harnessed."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harnessed==0.3.0",
    "cdpify[websocket]>=0.4.0,<0.5",
    "httpx2>=2.16,<3",
    "pillow>=13,<14",
    "pydantic>=2.12,<3",
    "pypdf>=6.21.4,<7",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
openai = ["harnessed[openai]==0.3.0"]
anthropic = ["harnessed[anthropic]==0.3.0"]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pylint>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "python-dotenv>=1,<2",
    "ruff>=0.14,<1",
    "ty>=0.0.93,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["browserrig"]

[tool.hatch.build.targets.sdist]
include = ["browserrig", "examples", "tests", "README.md",
           "pyproject.toml", "uv.lock", ".env.example", ".github", ".gitattributes",
           ".pre-commit-config.yaml", "package.json", "package-lock.json", "eslint.config.mjs",
           ".prettierrc.json", ".prettierignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
markers = ["integration: runs a real local Chrome browser"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pylint.main]
py-version = "3.12"
persistent = false
# Harnessed exposes its public API through module __getattr__.
ignored-modules = ["harnessed"]

[tool.pylint.messages_control]
disable = [
    # Documentation policy and formatting are separate from correctness checks.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",  # Ruff checks code while allowing long embedded HTML/JS strings.
    # Models, plugin hooks and transactions do not fit these size heuristics.
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "duplicate-code",
]

[tool.pylint.design]
max-nested-blocks = 3

[tool.pylint.reports]
reports = false
score = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["browserrig"]
