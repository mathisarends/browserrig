[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "browserrig"
version = "0.2.0"
description = "Event-driven Chrome automation for Harnessed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "harnessed==0.14.0",
    "cdpify[websocket]==0.5.0",
    "httpx2>=2.16,<3",
    "pillow>=13,<14",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
    "charset-normalizer>=3.4,<4",
]

[project.optional-dependencies]
openai = ["harnessed[openai]==0.14.0"]
anthropic = ["harnessed[anthropic]==0.14.0"]
mcp = ["harnessed[mcp]==0.14.0"]
otel = ["harnessed[otel]==0.14.0"]
# Document, spreadsheet, PDF and media readers for `read_file`.
files = [
    "pypdf>=6.21.4,<7",
    "beautifulsoup4>=4.14,<5",
    "defusedxml>=0.7.1,<0.8",
    "markdownify>=1.2,<2",
    "odfpy>=1.4.1,<2",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0.2,<2",
    "striprtf>=0.0.29,<0.1",
    "mutagen>=1.47,<2",
    "xlrd>=2.0.2,<3",
]
# Local CPU OCR for images and scanned PDFs; includes the file readers.
ocr = [
    "browserrig[files]",
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
    "opencv-python>=4.13,<5",
    "pypdfium2>=5.14,<6",
]

[project.urls]
Homepage = "https://github.com/mathisarends/browserrig"
Documentation = "https://github.com/mathisarends/browserrig/blob/main/README.md#documentation"
Repository = "https://github.com/mathisarends/browserrig"
Issues = "https://github.com/mathisarends/browserrig/issues"
Changelog = "https://github.com/mathisarends/browserrig/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "prek>=0.5.7,<0.6",
    "pylint>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "python-dotenv>=1,<2",
    "ruff>=0.14,<1",
    "smelt-cli==0.6.0",
    "ty>=0.0.93,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["browserrig"]

[tool.hatch.build.targets.sdist]
include = ["browserrig", "examples", "evals", "tests", "README.md", "CHANGELOG.md", "LICENSE",
           "pyproject.toml", "uv.lock", ".env.example", "compose.yml", "docs", ".github", ".gitattributes",
           ".pre-commit-config.yml", "smelt.yml", ".smelt.schema.json", ".smelt", "package.json", "pnpm-lock.yaml", "eslint.config.mjs",
           ".prettierrc.json", ".prettierignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Integration tests start Chrome; run them explicitly with `pytest -m integration`.
addopts = "--import-mode=importlib -m \"not integration\""
markers = ["integration: runs a real local Chrome browser"]

[tool.ruff]
target-version = "py312"
line-length = 88

# Existing long strings, comments and embedded fixtures still use the previous lint limit.
[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pylint.main]
py-version = "3.12"
persistent = false
# Harnessed exposes its public API through module __getattr__.
ignored-modules = ["harnessed"]

[tool.pylint.messages_control]
disable = [
    # Documentation policy and formatting are separate from correctness checks.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",  # Ruff handles line length, including long HTML test fixtures.
    # Models, plugin hooks and transactions do not fit these size heuristics.
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-locals",
    "duplicate-code",
]

[tool.pylint.design]
max-nested-blocks = 3

[tool.pylint.reports]
reports = false
score = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["browserrig", "evals"]
