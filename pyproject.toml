[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "browserrig"
version = "0.1.0"
description = "Event-driven Chrome automation for Harnessed."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harnessed==0.7.0",
    "cdpify[websocket]>=0.4.0,<0.5",
    "httpx2>=2.16,<3",
    "pillow>=13,<14",
    "pydantic>=2.12,<3",
    "pypdf>=6.21.4,<7",
    "pyyaml>=6,<7",
    "beautifulsoup4>=4.14,<5",
    "charset-normalizer>=3.4,<4",
    "defusedxml>=0.7.1,<0.8",
    "markdownify>=1.2,<2",
    "odfpy>=1.4.1,<2",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0.2,<2",
    "striprtf>=0.0.29,<0.1",
    "mutagen>=1.47,<2",
    "xlrd>=2.0.2,<3",
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
    "opencv-python>=4.13,<5",
    "pypdfium2>=5.14,<6",
]

[project.optional-dependencies]
openai = ["harnessed[openai]==0.7.0"]
anthropic = ["harnessed[anthropic]==0.7.0"]
mcp = ["harnessed[mcp]==0.7.0"]
otel = ["harnessed[otel]==0.7.0"]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pylint>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "python-dotenv>=1,<2",
    "ruff>=0.14,<1",
    "ty>=0.0.93,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["browserrig"]

[tool.hatch.build.targets.sdist]
include = ["browserrig", "examples", "tests", "README.md",
           "pyproject.toml", "uv.lock", ".env.example", "compose.yml", "docs", ".github", ".gitattributes",
           ".pre-commit-config.yaml", "package.json", "package-lock.json", "eslint.config.mjs",
           ".prettierrc.json", ".prettierignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Integration tests start Chrome; run them explicitly with `pytest -m integration`.
addopts = "--import-mode=importlib -m \"not integration\""
markers = ["integration: runs a real local Chrome browser"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pylint.main]
py-version = "3.12"
persistent = false
# Harnessed exposes its public API through module __getattr__.
ignored-modules = ["harnessed"]

[tool.pylint.messages_control]
disable = [
    # Documentation policy and formatting are separate from correctness checks.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",  # Ruff handles line length, including long HTML test fixtures.
    # Models, plugin hooks and transactions do not fit these size heuristics.
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "duplicate-code",
]

[tool.pylint.design]
max-nested-blocks = 3

[tool.pylint.reports]
reports = false
score = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["browserrig"]
